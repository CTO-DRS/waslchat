name: Build release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
# توفير دقائق Actions المجانية: أي دفع جديد يلغي البناء السابق المعلّق لنفس الفرع
concurrency:
  group: build-apk-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/wasl-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: flutter build apk --release --target-platform android-arm64
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk wasl_chat_release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wasl_chat_release
          path: wasl_chat_release.apk
