<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصل شات — ملف شخصي</title>
<style>
  :root { --bg:#0d1522; --card:#151f30; --ink:#eef2f8; --dim:#94a3b8; --teal:#14b8a6; --violet:#a5b4fc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: clamp(12px, 4vw, 32px);
  }
  .card {
    background: var(--card); border-radius: 22px; max-width: 420px; width: 100%;
    padding: 0 0 clamp(20px, 5vw, 30px); text-align: center; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .pad { padding: 0 clamp(20px, 5vw, 30px); }
  .cover {
    width: 100%; height: clamp(110px, 30vw, 150px); object-fit: cover; display: block;
    background: linear-gradient(135deg, var(--teal), var(--violet));
  }
  .logo {
    width: clamp(56px, 14vw, 72px); height: clamp(56px, 14vw, 72px); border-radius: 18px;
    background: linear-gradient(135deg, var(--teal), var(--violet));
    display: flex; align-items: center; justify-content: center;
    margin: clamp(18px, 5vw, 26px) auto 12px; font-size: clamp(26px, 6vw, 34px); font-weight: 800; color: #fff;
  }
  .avatar {
    width: clamp(74px, 19vw, 92px); height: clamp(74px, 19vw, 92px); border-radius: 50%;
    object-fit: cover; border: 4px solid var(--card); background: #1e2a3d;
    margin: -42px auto 8px; position: relative; display: flex; align-items: center;
    justify-content: center; font-size: clamp(28px, 7vw, 36px); font-weight: 800; color: #fff;
  }
  .over { margin-top: -42px; position: relative; }
  .logo-solo { margin-top: clamp(18px, 5vw, 26px); }
  h1 { font-size: clamp(19px, 5vw, 24px); margin-bottom: 4px; }
  .user { color: var(--teal); font-weight: 700; direction: ltr; unicode-bidi: embed; word-break: break-all; }
  .bio { color: var(--ink); opacity: .8; font-size: clamp(13px, 3.6vw, 15px); line-height: 1.8; margin: 10px 0 4px; }
  p { color: var(--dim); font-size: clamp(13px, 3.6vw, 15px); line-height: 1.8; margin: 12px 0 20px; }
  .btn {
    display: block; width: 100%; padding: 13px 16px; border-radius: 14px; text-decoration: none;
    font-size: clamp(14px, 3.8vw, 16px); font-weight: 700; margin-bottom: 10px;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-ghost { background: transparent; color: var(--violet); border: 1.5px solid var(--violet); }
  .hint { font-size: clamp(11px, 3vw, 12.5px); color: var(--dim); margin-top: 10px; }
  .hint b { color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div id="top"><div class="cover logo-solo"></div></div>
  <div class="pad">
    <div id="mid"></div>
    <div id="info">
      <h1>وصل شات</h1>
      <p>مراسلة مشفّرة وصوتيات ومجتمعات — بين مستخدمي وصل فقط.</p>
    </div>
    <a class="btn btn-primary" id="dl" href="https://github.com/CTO-DRS/waslchat/releases/latest/download/wasl_chat.apk">حمّل وصل شات (APK)</a>
    <a class="btn btn-ghost" id="open" href="/" style="display:none">افتح المحادثة في التطبيق</a>
    <a class="btn btn-ghost" href="/">الصفحة الرئيسية</a>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script>
(function () {
  var PKG = 'app.waslchat.wasl_chat';
  var APK = 'https://github.com/CTO-DRS/waslchat/releases/latest/download/wasl_chat.apk';
  var SUPA = 'https://hplzbillnbdjtufazrlp.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwbHpiaWxsbmJkanR1ZmF6cmxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMTAyNjAsImV4cCI6MjEwOTU4NjI2MH0.EqWiUY_Pl70-RTJ-CM2mZqpI8Du1xuAIk8BagRpB9FI';
  var m = /^\/@([a-z0-9_]{1,32})\/?$/i.exec(decodeURIComponent(location.pathname));
  if (!m) return;
  var u = m[1].toLowerCase().replace(/[^a-z0-9_]/g, '_');
  var fallback = 'https://waslchat.app/@' + u;
  document.getElementById('dl').textContent = 'حمّل وصل شات لتتحدث مع @' + u;
  document.getElementById('open').style.display = 'block';
  document.getElementById('open').href =
    'intent://waslchat.app/@' + u + '#Intent;scheme=https;package=' + PKG +
    ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  document.getElementById('hint').innerHTML =
    'داخل التطبيق: <b>محادثات ← بحث جديد ← اكتب @' + u + '</b>' +
    '<br>زر «افتح في التطبيق» يعمل مباشرة إن كان التطبيق مثبتاً على جهازك.';
  fetch(SUPA + '/rest/v1/rpc/profile_public_by_username', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_username: u })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(0); })
    .then(function (rows) {
      var p = rows && rows[0];
      if (!p) return;
      var top = document.getElementById('top'), mid = document.getElementById('mid');
      var html = '';
      html += p.cover_url
        ? '<img class="cover" src="' + p.cover_url + '" alt="" onerror="this.remove()">'
        : '<div class="cover"></div>';
      if (p.avatar_url) {
        html += '<img class="avatar" src="' + p.avatar_url + '" alt="" ' +
                'onerror="this.outerHTML=\'<div class=&quot;avatar over&quot;>و</div>\'">';
      } else {
        html += '<div class="avatar over">و</div>';
      }
      top.innerHTML = html;
      var info = document.getElementById('info');
      var name = (p.display_name || '').trim();
      info.innerHTML =
        '<h1>' + (name ? escapeHtml(name) : '@<span class="user">' + u + '</span>') + '</h1>' +
        '<div class="user">@' + u + '</div>' +
        (p.bio ? '<div class="bio">' + escapeHtml(p.bio) + '</div>' : '') +
        '<p>ملف شخصي داخل وصل شات — افتح المحادثة مباشرة إن كان التطبيق مثبتاً، أو حمّله الآن.</p>';
      document.title = (name || '@' + u) + ' — وصل شات';
    }).catch(function () {});
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
