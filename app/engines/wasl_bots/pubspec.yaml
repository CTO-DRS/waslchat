name: wasl_bots
description: "كتالوج البوتات المجتمعية وصل شات — المحرك النقي الثالث عشر: بيانات بوتات موثقة بتوقيع HMAC-SHA256 يدوي فوق SHA-256 النقي (FIPS 180-4، معاد استخدامه من محرك النماذج) بصيغة واجهة X-Wasl-Signature القائمة، وقوالب جاهزة ثلاثة (ترحيب وحضور واقتراحات) بحدود معلنة ورندر حتمي، وكتالوج بترتيب قياسي وتكرار مرفوض — بلا شبكة ولا dart:io (الرفع غير ممكن بنياً)."
version: 1.0.0
homepage: https://waslchat.app
repository: https://github.com/CTO-DRS/waslchat
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'

dev_dependencies:
  test: ^1.25.0
