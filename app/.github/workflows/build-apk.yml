name: Build release APK
on:
  push:
    branches: [app]
  workflow_dispatch:
# أي دفع جديد يلغي البناء السابق المعلّق لنفس الفرع
concurrency:
  group: build-apk-app
  cancel-in-progress: true
permissions:
  contents: write # لنشر الإصدار (Release) بالـAPK
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # لوزع هذا السر يجعل خطوة المرآة تنشر تلقائياً على القناة العامة waslchat؛
      # بدونه تُنشر الحزمة هنا فقط (ويمكن رفعها يدوياً من artifact بخطوتين)
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/wasl-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: flutter build apk --release --target-platform android-arm64
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk wasl_chat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wasl_chat_release
          path: wasl_chat.apk
      # نشر الإصدار ليصل رابط التحديث داخل التطبيق:
      # https://github.com/CTO-DRS/waslchat/releases/latest/download/wasl_chat.apk
      # فروع الميزات (مثل feature/wasl-shield) تُبنى للاختبار فقط بلا نشر
      # شُرط app كان فرعاً غير موجود أصلاً فكان النشر مستحيلاً؛ أضيف workflow_dispatch
      - name: Publish release (this repo)
        if: github.ref == 'refs/heads/app' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION"
          NOTES="APK موقّع بإصدار $VERSION — يُحمّل تلقائياً من شاشة «تحديث متوفر» داخل التطبيق."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wasl_chat.apk --clobber
            echo "updated $TAG in wasl-chat"
          else
            gh release create "$TAG" wasl_chat.apk --title "وصل شات $VERSION" --notes "$NOTES"
            echo "created $TAG in wasl-chat"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # القناة العامة التي يقرؤها المحدّث داخل التطبيق والموقع هي waslchat releases:
      # github.token محصور على هذا المستودع لذا تحتاج المرآة سراً باسم RELEASE_TOKEN
      # (PAT بصلاحية contents:write على waslchat) — وإن غاب السر تتخطى الخطوة نفسها
      - name: Mirror release to waslchat (public channel)
        if: env.RELEASE_TOKEN != '' && (github.ref == 'refs/heads/app' || github.event_name == 'workflow_dispatch')
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION"
          NOTES="APK موقّع بإصدار $VERSION — يُحمّل تلقائياً من شاشة «تحديث متوفر» داخل التطبيق."
          if gh release view "$TAG" --repo CTO-DRS/waslchat >/dev/null 2>&1; then
            gh release upload "$TAG" wasl_chat.apk --clobber --repo CTO-DRS/waslchat
            echo "updated $TAG in waslchat"
          else
            gh release create "$TAG" wasl_chat.apk --repo CTO-DRS/waslchat --title "وصل شات $VERSION" --notes "$NOTES"
            echo "created $TAG in waslchat"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
