name: wasl_chat
description: "وصل شات - تطبيق مراسلة وتواصل"
publish_to: 'none'
version: 0.5.0+29

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  record: ^7.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.3.0
  qr_flutter: ^4.1.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  file_picker: 8.3.7
  video_player: ^2.14.1
  open_filex: ^5.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  app_links: ^6.3.2
  # الموقع المشفّر وبطاقات جهات الاتصال (0.4.6 — المرحلة 1)
  geolocator: ^13.0.1
  flutter_contacts: ^1.1.9
  url_launcher: ^6.3.0
  characters: ^1.3.0
  # ضغط الفيديو بمُرمّزات المنصة والمصغّرة والتنزيل التلقائي (0.4.8 — المرحلة 1)
  video_compressor_plus: ^4.1.0
  connectivity_plus: ^6.1.0
  # الملصقات والصور المتحركة (0.4.9 — المرحلة 1):
  # image مكتبة pure-Dart لفك/ترميز الصور الكبيرة على الجهاز — بلا كود C أصلي
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # حزمة الملصقات المدمجة (0.4.9) — رسومات أصلية داخل التطبيق
  assets:
    - assets/stickers/basics/

# نسخ بدون كود C أصلي (jni) لتسهيل البناء
dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28
