name: wasl_chat
description: "وصل شات - تطبيق مراسلة وتواصل"
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  record: ^7.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# نسخ بدون كود C أصلي (jni) لتسهيل البناء
dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.28
