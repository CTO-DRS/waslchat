<head>

  <meta charset="UTF-8">

  <meta name="description" content="وصل شات على الويب: محادثاتك المشفّرة من المتصفح.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <title>وصل شات · ويب</title>
  <meta name="theme-color" content="#070B1F">
  <style>body{background:#070B1F;margin:0}#wi{position:fixed;z-index:2147483647;bottom:16px;left:16px;display:none;align-items:center;gap:8px;background:#2EE6C5;color:#070B1F;border:0;border-radius:999px;padding:10px 16px;font:600 15px sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer}#wi.ios{background:#111a3a;color:#e8f0ff;cursor:default;max-width:260px;line-height:1.5;border-radius:14px;font-weight:400}#wi .x{background:none;border:0;color:inherit;font-size:18px;cursor:pointer;padding:0 0 0 4px}#wl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#2EE6C5;font-family:sans-serif;font-size:18px}</style>
  <link rel="manifest" href="manifest.json">
  <script>
    // المرحلة 12 (0.28.0): تسجيل عامل الصفحة + التقاط حدث التثبيت.
    // خدمة PWA تقرأ __waslCanInstall و__waslDeferredPrompt من هنا.
    window.__waslCanInstall = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__waslDeferredPrompt = e;
      window.__waslCanInstall = true;
      waslShowInstall();
    });
    window.addEventListener('appinstalled', function () {
      window.__waslCanInstall = false;
      window.__waslDeferredPrompt = null;
      waslHideInstall();
    });
    // زر «ثبّت التطبيق»: يظهر فقط إن كان التثبيت متاحاً ولم يُثبَّت بعد
    function waslInstalled() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    }
    function waslHideInstall() { var b = document.getElementById('wi'); if (b) b.style.display = 'none'; }
    function waslShowInstall() {
      if (waslInstalled()) return;
      var b = document.getElementById('wi'); if (!b) return;
      b.className = ''; b.textContent = 'ثبّت التطبيق';
      b.onclick = function () {
        var e = window.__waslDeferredPrompt; if (!e) return waslHideInstall();
        e.prompt();
        (e.userChoice || Promise.resolve()).then(function () {
          window.__waslDeferredPrompt = null; window.__waslCanInstall = false; waslHideInstall();
        });
      };
      b.style.display = 'flex';
    }
    function waslIosHint() {
      var ua = navigator.userAgent || '';
      var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios || waslInstalled()) return;
      try { if (localStorage.getItem('wasl_ios_hint') === '1') return; } catch (_) {}
      var b = document.getElementById('wi'); if (!b) return;
      b.className = 'ios'; b.onclick = null;
      b.innerHTML = '<span>لتثبيت التطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</span><button class="x" aria-label="إغلاق">×</button>';
      b.querySelector('.x').onclick = function () { try { localStorage.setItem('wasl_ios_hint', '1'); } catch (_) {} waslHideInstall(); };
      b.style.display = 'flex';
    }
    document.addEventListener('DOMContentLoaded', function () {
      if (window.__waslDeferredPrompt) waslShowInstall(); else waslIosHint();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          // فشل التسجيل لا يمنع التطبيق — بلا عمل دون اتصال بصدق
        });
      });
    }
  </script>
</head>
<body>
  <div id="wi" role="button" style="display:none"></div>
  <div id="wl">وصل شات… جارٍ التحميل</div>
